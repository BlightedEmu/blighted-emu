[workspace]
resolver = "3"
members = ["crates/*", "bins/*"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "env"] }
crc32fast = { version = "1.5.2", default-features = false, features = ["std"] }
data-encoding = { version = "2.11.1", default-features = false, features = ["alloc"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
figment = { version = "0.10.19", default-features = false, features = ["toml", "env"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
getrandom = { version = "0.3.4", default-features = false, features = ["std"] }
hex = { version = "0.4.3", default-features = false, features = ["std"] }
hmac = { version = "0.13.0", default-features = false }
http-body-util = { version = "0.1.3", default-features = false }
async-nats = { version = "0.50.0", default-features = false, features = ["ring"] }
bevy_ecs = { version = "0.20.0", default-features = false, features = ["std"] }
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
httpdate = { version = "1.0.3", default-features = false }
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
metrics = { version = "0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
openssl = { version = "0.10.81", default-features = false }
oozextract = { version = "0.5.5", default-features = false }
open = { version = "5.4.4", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
prettyplease = { version = "0.3.0", default-features = false }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["proc-macro"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
quick-xml = { version = "0.42.0", default-features = false, features = ["serialize"] }
quote = { version = "1.0.47", default-features = false, features = ["proc-macro"] }
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls-no-provider"] }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.145", default-features = false, features = ["std"] }
sha2 = { version = "0.11.1", default-features = false }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "tls-none"] }
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "printing"] }
tempfile = { version = "3.27.0", default-features = false }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
tokio = { version = "1.53.2", default-features = false }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter", "std"] }
uuid = { version = "1.28.0", default-features = false, features = ["std", "v4", "serde"] }
weezl = { version = "0.2.1", default-features = false, features = ["alloc"] }
zip = { version = "9.0.2", default-features = false }

nw-bus = { path = "crates/nw-bus", version = "0.1.0" }
nw-carrier = { path = "crates/nw-carrier", version = "0.1.0" }
nw-common = { path = "crates/nw-common", version = "0.1.0" }
nw-content = { path = "crates/nw-content", version = "0.1.0" }
nw-db = { path = "crates/nw-db", version = "0.1.0" }
nw-dtls = { path = "crates/nw-dtls", version = "0.1.0" }
nw-formats = { path = "crates/nw-formats", version = "0.1.0" }
nw-login = { path = "crates/nw-login", version = "0.1.0" }
nw-testclient = { path = "bins/nw-testclient", version = "0.1.0" }
nw-oodle = { path = "crates/nw-oodle", version = "0.1.0" }
nw-protocol = { path = "crates/nw-protocol", version = "0.1.0" }
nw-messages = { path = "crates/nw-messages", version = "0.1.0" }
nw-reflect = { path = "crates/nw-reflect", version = "0.1.0" }
nw-sim-core = { path = "crates/nw-sim-core", version = "0.1.0" }
nw-world = { path = "crates/nw-world", version = "0.1.0" }
sim = { path = "bins/sim", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# Build size rules (spec 10.6): file and line numbers in our code, no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Kraken decoding is slow without optimisation; this keeps local-data tests fast in the dev profile.
[profile.dev.package.oozextract]
opt-level = 3

# Heightmap tests encode and decode full 2048 x 2048 LZW images; unoptimised LZW is slow.
[profile.dev.package.weezl]
opt-level = 3
