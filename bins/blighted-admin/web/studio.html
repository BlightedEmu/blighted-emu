<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio · Blighted Emu</title>
  <link rel="stylesheet" href="/web/style.css">
  <script src="/web/theme.js"></script>
</head>
<body>
  <nav class="rail" aria-label="Pages">
    <a href="/">Home</a>
    <a href="/live">Live</a>
    <a href="/studio" aria-current="page">Studio</a>
    <a href="/records">Records</a>
    <a href="/todo">To-do</a>
    <a href="/gm">GM</a>
    <a href="/web/map.html">Map</a>
    <a href="/web/captures.html">Captures</a>
    <button type="button" class="theme" id="theme"></button>
  </nav>
  <main class="work">
    <header class="masthead">
      <h1>Blighted Emu <span>· Studio</span></h1>
      <div class="end">
        <span class="status" id="status" role="status"></span>
        <button type="button" id="check">Check</button>
        <button type="button" id="apply">Apply</button>
      </div>
    </header>
    <section class="apply" id="apply-line" data-phase="idle" aria-label="Apply">
      <div class="apply-bar"><i id="apply-bar"></i></div>
      <p><b id="apply-word">Idle</b> <span id="apply-detail" class="muted">Apply checks the design files, writes the merged content, and restarts the local world.</span></p>
    </section>
    <section class="problems-block" aria-label="Problems">
      <div class="section-head"><h2>Problems</h2></div>
      <ul class="list problems" id="problems"><li class="muted">None found.</li></ul>
    </section>
    <section class="editor" aria-label="Editors">
      <div class="section-head">
        <h2>Editors</h2>
        <div class="tabs" role="group" aria-label="Kind">
          <button type="button" data-editor="ai_profile">AI profile</button>
          <button type="button" data-editor="path">Path</button>
          <button type="button" data-editor="spawn_group">Spawn group</button>
        </div>
        <span class="status" id="editor-status" role="status"></span>
      </div>
      <form class="gm" id="form-ai_profile" data-kind="ai_profile">
        <input type="text" name="id" aria-label="profile id" placeholder="profile id" class="wide">
        <select name="behaviour" aria-label="behaviour"></select>
        <span id="profile-numbers" class="gm"></span>
      </form>
      <form class="gm" id="form-path" data-kind="path" hidden>
        <input type="text" name="id" aria-label="path id" placeholder="path id" class="wide">
        <select name="mode" aria-label="mode"></select>
        <input type="text" name="waits" aria-label="waits at each point (ms, split by commas)" placeholder="waits ms: 3000, 0" class="wide">
      </form>
      <form class="gm" id="form-spawn_group" data-kind="spawn_group" hidden>
        <input type="text" name="id" aria-label="group id" placeholder="group id" class="wide">
        <input type="text" name="vitals" aria-label="vitals id" placeholder="vitals id" class="wide">
        <input type="text" name="level" inputmode="numeric" aria-label="level" placeholder="level">
        <input type="text" name="profile" list="profile-ids" aria-label="AI profile (optional)" placeholder="AI profile" class="wide">
        <input type="text" name="path" list="path-ids" aria-label="path (optional)" placeholder="path" class="wide">
      </form>
      <datalist id="profile-ids"></datalist>
      <datalist id="path-ids"></datalist>
      <div class="gm">
        <span class="muted" id="editor-points"></span>
        <button type="button" id="editor-undo">Undo point</button>
        <button type="button" id="editor-clear">Clear points</button>
        <button type="button" id="editor-new">New</button>
        <button type="button" id="editor-save">Save</button>
        <button type="button" class="danger" id="editor-delete">Delete</button>
      </div>
      <section class="chart editor-map" id="editor-map-box" aria-label="Editor map">
        <canvas class="map" id="editor-map"></canvas>
        <form class="map-tools gm" id="editor-goto">
          <input type="text" name="x" inputmode="decimal" aria-label="x (metres)" placeholder="x">
          <input type="text" name="y" inputmode="decimal" aria-label="y (metres)" placeholder="y">
          <button type="submit">Go</button>
          <button type="button" id="editor-zoom-in">Zoom in</button>
          <button type="button" id="editor-zoom-out">Zoom out</button>
          <button type="button" id="editor-fit">Whole world</button>
        </form>
      </section>
    </section>
    <details class="players" open>
      <summary class="section-head"><h2>Design files</h2><span class="status" id="files-count"></span></summary>
      <div class="table-scroll">
        <table class="grid">
          <thead>
            <tr><th>Kind</th><th>Id</th><th>Action</th><th>Map</th><th>File</th></tr>
          </thead>
          <tbody id="files"></tbody>
        </table>
      </div>
    </details>
  </main>
  <script type="module" src="/web/studio.js"></script>
</body>
</html>
