<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map · Blighted Emu</title>
  <link rel="stylesheet" href="/web/style.css">
  <script src="/web/theme.js"></script>
</head>
<body class="map-page">
  <nav class="rail" aria-label="Pages">
    <a href="/">Home</a>
    <a href="/live">Live</a>
    <a href="/studio">Studio</a>
    <a href="/web/map.html" aria-current="page">Map</a>
    <a href="/web/captures.html">Captures</a>
    <button type="button" class="theme" id="theme"></button>
  </nav>
  <main class="work">
    <header class="masthead">
      <h1>Blighted Emu <span>· Map</span></h1>
      <div class="end"><span class="status" id="status"></span></div>
    </header>
    <div class="toolbar">
      <label>Layer
        <select id="layer">
          <option value="tiles">Map tiles</option>
          <option value="relief">Relief</option>
          <option value="both">Relief over tiles</option>
        </select>
      </label>
      <label><input type="checkbox" value="vitals" class="kind"> <i class="swatch" data-kind="vitals"></i> Mob spawns</label>
      <label><input type="checkbox" value="gatherables" class="kind"> <i class="swatch" data-kind="gatherables"></i> Gatherables</label>
      <label><input type="checkbox" value="landmarks" class="kind"> <i class="swatch" data-kind="landmarks"></i> Landmarks</label>
      <button id="zoom-in" type="button">Zoom in</button>
      <button id="zoom-out" type="button">Zoom out</button>
      <button id="fit" type="button">Whole world</button>
    </div>
    <section class="chart" aria-label="World map"><canvas id="map" class="map"></canvas></section>
  </main>
  <script type="module">
    import { LAYERS, SPAWN_ZOOM_M_PER_PX, WorldMap } from '/web/map.js';

    const status = document.getElementById('status');
    const info = await (await fetch('/api/world/info')).json();
    let cursor = null;
    const map = new WorldMap(document.getElementById('map'), info, (point) => {
      cursor = point;
      showStatus();
    });
    function showStatus() {
      const view = map.currentView();
      const at = cursor ? `${cursor.x.toFixed(1)}, ${cursor.y.toFixed(1)}` : '—';
      const spawns = view.metresPerPixel > SPAWN_ZOOM_M_PER_PX ? ' · zoom in for spawns' : '';
      status.textContent = `cursor ${at} · ${view.metresPerPixel.toFixed(2)} m/px${spawns}`;
    }
    const layer = document.getElementById('layer');
    layer.value = info.map_tiles ? LAYERS.TILES : LAYERS.RELIEF;
    layer.addEventListener('change', () => map.setLayer(layer.value));
    const kinds = [...document.querySelectorAll('.kind')];
    for (const box of kinds) {
      box.addEventListener('change', () =>
        map.setSpawnKinds(kinds.filter((item) => item.checked).map((item) => item.value)));
    }
    document.getElementById('zoom-in').addEventListener('click', () => { map.zoom(1); showStatus(); });
    document.getElementById('zoom-out').addEventListener('click', () => { map.zoom(-1); showStatus(); });
    document.getElementById('fit').addEventListener('click', () => { map.fit(); showStatus(); });
    map.onSelect((item) => {
      if (item && item.id) {
        const key = item.key ? ` · design key ${item.key}` : '';
        status.textContent = `${item.kind} ${item.id}${item.level === null ? '' : ` level ${item.level}`} at ${item.x.toFixed(1)}, ${item.y.toFixed(1)}${key}`;
      }
    });
    showStatus();
  </script>
</body>
</html>
