<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GM · Blighted Emu</title>
  <link rel="stylesheet" href="/web/style.css">
  <script src="/web/theme.js"></script>
</head>
<body>
  <nav class="rail" aria-label="Pages">
    <a href="/">Home</a>
    <a href="/live">Live</a>
    <a href="/studio">Studio</a>
    <a href="/records">Records</a>
    <a href="/todo">To-do</a>
    <a href="/gm" aria-current="page">GM</a>
    <a href="/web/map.html">Map</a>
    <a href="/web/captures.html">Captures</a>
    <button type="button" class="theme" id="theme"></button>
  </nav>
  <main class="work">
    <header class="masthead">
      <h1>Blighted Emu <span>· GM</span></h1>
      <div class="end"><span class="status" id="me"></span><button type="button" id="logout" hidden>Log out</button></div>
    </header>
    <section class="problems-block" aria-label="Bans">
      <div class="section-head"><h2>Ban</h2></div>
      <form class="gm" id="ban">
        <input type="text" id="ban-name" aria-label="login name" placeholder="login name" class="wide">
        <button type="submit" class="danger">Ban</button>
        <button type="button" id="unban">Unban</button>
      </form>
    </section>
    <section class="problems-block" aria-label="Ranks" id="ranks-block" hidden>
      <div class="section-head"><h2>Ranks</h2></div>
      <form class="gm" id="rank">
        <input type="text" id="rank-name" aria-label="login name" placeholder="login name" class="wide">
        <select id="rank-value" aria-label="rank">
          <option value="csr">CSR</option>
          <option value="game_master">Game master</option>
          <option value="head_admin">Head admin</option>
          <option value="">No rank</option>
        </select>
        <button type="submit">Set</button>
      </form>
      <ul class="list" id="ranks"></ul>
    </section>
    <p class="status" id="status" role="status"></p>
    <details class="players" open>
      <summary class="section-head"><h2>Audit log</h2><span class="status" id="audit-count"></span></summary>
      <div class="table-scroll">
        <table class="grid">
          <thead><tr><th>Time</th><th>Who</th><th>Rank</th><th>Command</th><th>Target</th><th>Result</th></tr></thead>
          <tbody id="audit"></tbody>
        </table>
      </div>
    </details>
  </main>
  <script type="module" src="/web/gm-page.js"></script>
</body>
</html>
