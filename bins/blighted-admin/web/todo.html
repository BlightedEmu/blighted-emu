<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do · Blighted Emu</title>
  <link rel="stylesheet" href="/web/style.css">
  <script src="/web/theme.js"></script>
</head>
<body>
  <nav class="rail" aria-label="Pages">
    <a href="/">Home</a>
    <a href="/live">Live</a>
    <a href="/studio">Studio</a>
    <a href="/records">Records</a>
    <a href="/todo" aria-current="page">To-do</a>
    <a href="/gm">GM</a>
    <a href="/web/map.html">Map</a>
    <a href="/web/captures.html">Captures</a>
    <button type="button" class="theme" id="theme"></button>
  </nav>
  <main class="work">
    <header class="masthead">
      <h1>Blighted Emu <span>· To-do</span></h1>
      <div class="end"><span class="status" id="status" role="status"></span></div>
    </header>
    <section class="problems-block" aria-label="New task">
      <form class="gm" id="import">
        <input type="url" id="issue-url" aria-label="GitHub issue address" placeholder="https://github.com/owner/repo/issues/1" class="todo-wide">
        <button type="submit">Import issue</button>
      </form>
      <form class="gm" id="add">
        <input type="text" id="new-title" aria-label="title" placeholder="title" class="todo-wide">
        <select id="new-kind" aria-label="kind"></select>
        <button type="submit">Add task</button>
      </form>
    </section>
    <section class="problems-block" aria-label="Tasks">
      <div class="section-head">
        <h2>Tasks</h2>
        <select id="state-filter" aria-label="state filter"></select>
      </div>
      <ul class="list todo-tasks" id="tasks"></ul>
    </section>
    <section class="problems-block" aria-label="Changed design files">
      <div class="section-head"><h2>Changed design files</h2><button type="button" id="refresh-changed">Refresh</button></div>
      <p class="muted">Design files that differ from the last commit. Link them to a task before you commit.</p>
      <ul class="list" id="changed"></ul>
      <datalist id="changed-files"></datalist>
    </section>
  </main>
  <script type="module" src="/web/todo.js"></script>
</body>
</html>
