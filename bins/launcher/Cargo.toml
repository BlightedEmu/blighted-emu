[package]
name = "launcher"
version = "0.1.0"
description = "Player launcher: logs in to a community server and starts BlightedNewWorld.exe directly."
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
publish.workspace = true

# the file name players get: BlightedLauncher (.exe on Windows)
[[bin]]
name = "BlightedLauncher"
path = "src/main.rs"

[dependencies]
base64.workspace = true
chrono.workspace = true
image.workspace = true
nw-protocol.workspace = true
open.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-updater.workspace = true
thiserror.workspace = true
# The loopback proxy (bins/launcher/src/aws_proxy.rs) needs an async runtime and TLS.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "io-util"] }
tokio-rustls.workspace = true

[target.'cfg(windows)'.dependencies]
rfd.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "io-util"] }
tokio-rustls.workspace = true

[lints]
workspace = true
