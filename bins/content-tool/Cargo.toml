[package]
name = "content-tool"
version = "0.1.0"
description = "Builds generated table code, the content bundle and the world files from a New World client install, and checks capture ledgers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
crc32fast.workspace = true
hex.workspace = true
nw-capture.workspace = true
nw-carrier.workspace = true
nw-messages.workspace = true
nw-common.workspace = true
nw-content.workspace = true
nw-design.workspace = true
nw-formats.workspace = true
nw-oodle.workspace = true
nw-reflect.workspace = true
nw-sim-core.workspace = true
nw-world.workspace = true
png.workspace = true
prettyplease.workspace = true
proc-macro2.workspace = true
quote.workspace = true
serde.workspace = true
serde_json.workspace = true
syn.workspace = true
thiserror.workspace = true
# Capture archives are deflate zip files.
zip = { workspace = true, features = ["deflate-flate2"] }

[dev-dependencies]
nw-capture = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[features]
# Tests that read the user's own New World install (set NW_GAME_DIR).
local-data = ["nw-formats/local-data", "nw-oodle/local-data"]

[lints]
workspace = true
