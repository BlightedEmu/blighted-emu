[package]
name = "sim"
version = "0.1.0"
description = "World simulation: one cell of a level, 30 Hz, movement checks and replication."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bevy_ecs.workspace = true
clap.workspace = true
getrandom.workspace = true
metrics.workspace = true
metrics-exporter-prometheus = { workspace = true, features = ["http-listener"] }
nw-bus.workspace = true
nw-common.workspace = true
nw-content.workspace = true
nw-db.workspace = true
nw-formats.workspace = true
nw-messages.workspace = true
nw-reflect.workspace = true
nw-sim-core.workspace = true
nw-world.workspace = true
serde.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
nw-sim-core = { workspace = true, features = ["test-util"] }
nw-bus = { workspace = true, features = ["test-util"] }
nw-carrier.workspace = true
nw-db = { workspace = true, features = ["test-util"] }
serde_json.workspace = true

[features]
# `combat::test_support`: combat rows for other crates' tests.
test-util = []
# Tests that need the Docker Compose NATS and PostgreSQL (`just test-infra`).
infra = []

[lints]
workspace = true
