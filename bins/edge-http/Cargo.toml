[package]
name = "edge-http"
version = "0.1.0"
description = "HTTPS login queue for the preservation server."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "tracing"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
clap.workspace = true
hex = { version = "0.4.3", default-features = false, features = ["std"] }
hmac = { version = "0.13.0", default-features = false }
metrics = { version = "0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
nw-common.workspace = true
nw-db = { path = "../../crates/nw-db", version = "0.1.0" }
nw-edge-config.workspace = true
nw-protocol.workspace = true
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "connection-manager"] }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.11.1", default-features = false }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "tls-none"] }
thiserror.workspace = true
tokio = { version = "1.53.2", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber.workspace = true
uuid = { version = "1.28.0", default-features = false, features = ["std", "v4"] }

[dev-dependencies]
nw-db = { path = "../../crates/nw-db", version = "0.1.0", features = ["test-util"] }
tempfile.workspace = true
tokio = { version = "1.53.2", default-features = false, features = ["macros", "rt"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
http-body-util = { version = "0.1.3", default-features = false }

[lints]
workspace = true
