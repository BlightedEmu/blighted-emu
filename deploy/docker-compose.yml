# Infrastructure for the Blighted New World emulator (spec 3, 7, 12 M0).
# Start with: just infra-up   Test with: just infra-test
name: nw-emu

x-healthcheck-timing: &healthcheck-timing
  interval: 5s
  timeout: 3s
  retries: 20

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in deploy/.env}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      <<: *healthcheck-timing
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1-alpine
    # Valkey holds only short-lived data (spec 7.2), so disk persistence is off.
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      <<: *healthcheck-timing
    restart: unless-stopped

  nats:
    image: nats:2.11-alpine
    # Core NATS only, no JetStream (spec 7.3). 8222 is the monitoring port.
    command: ["--http_port", "8222"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:4222:4222"
      - "${BIND_ADDRESS:-127.0.0.1}:8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      <<: *healthcheck-timing
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      <<: *healthcheck-timing
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in deploy/.env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/.env}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      <<: *healthcheck-timing
    restart: unless-stopped

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
