[package]
name = "nw-db"
version = "0.1.0"
description = "PostgreSQL migrations and records for accounts, launcher sessions and characters."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["migrate", "macros", "uuid", "json"] }
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
# Database fixture for tests in this and other crates.
test-util = []
# Tests that need the Docker Compose PostgreSQL (`just test-infra`).
infra = ["test-util"]

[lints]
workspace = true
