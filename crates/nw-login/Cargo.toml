[package]
name = "nw-login"
version = "0.1.0"
description = "Login server logic: accounts, sessions, launcher API, login queue and entry tickets."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2.workspace = true
axum.workspace = true
data-encoding.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
httpdate.workspace = true
nw-common.workspace = true
nw-db.workspace = true
nw-protocol.workspace = true
redis.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tower.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
http-body-util.workspace = true
sqlx.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[features]
# Test helpers for this and other crates.
test-util = []
# Tests that need the Docker Compose PostgreSQL and Valkey (`just test-infra`).
infra = ["nw-db/infra", "test-util"]

[lints]
workspace = true
