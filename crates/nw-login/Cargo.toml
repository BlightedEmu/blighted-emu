[package]
name = "nw-login"
version = "0.1.0"
description = "Login server logic: accounts, sessions, launcher API, login queue and entry tickets."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2.workspace = true
data-encoding.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
nw-common.workspace = true
nw-db.workspace = true
nw-protocol.workspace = true
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[features]
# Tests that need the Docker Compose PostgreSQL and Valkey (`just test-infra`).
infra = ["nw-db/infra"]

[lints]
workspace = true
