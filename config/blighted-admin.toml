# blighted-admin configuration (Blighted Emu admin tools, spec section 6). This file holds no secret.
# Any key below can be overridden with BLIGHTED_ADMIN_<KEY>, nested keys joined by "__".

# The admin pages. Only a loopback address is allowed: the tools have no login.
listen = "127.0.0.1:9180"
log_filter = "info"
client_build_config = "config/client-build.toml"
# World files from `just world`, the content bundle from `just bundle`, and the map tiles from
# `just map-tiles` (in <content_dir>/map/).
content_dir = "local-data/content"
level = "newworld_vitaeeterna"
# Most spawn points one map request returns.
max_spawns_per_request = 5000

[captures]
# Capture ledgers (`ledger.bin`) in any folder below this one.
captures_dir = "local-data/captures"
# The saved Discord threads that name the open-world sessions.
discord_dir = "local-data/open world captures"
# The archive that local-data/azoth-catalog/archive.py saves from the Azoth catalog site.
azoth_dir = "local-data/azoth-catalog"
# The client type table, in the install folder (NW_GAME_DIR).
type_index = "typeindex.json"
# Aeternum-World class names (AGPL-3.0).
type_names = "local-data/Aeternum-World-main/Catalog/uuid_to_class.json"

[live]
# The bus and the world of config/world-director.toml.
nats_url = "nats://127.0.0.1:4222"
world_id = "8d0f4c2e-0000-4000-8000-000000000001"
# The metrics listeners of config/rep-gateway.toml, config/sim.toml and config/world-director.toml.
metrics_urls = ["http://127.0.0.1:9101/metrics", "http://127.0.0.1:9102/metrics", "http://127.0.0.1:9103/metrics"]
# Time between scrapes and CPU samples, and between two states sent to the page (at least 100).
scrape_interval_ms = 1000
state_interval_ms = 250
# Program names of the CPU tile.
processes = ["sim", "rep-gateway", "world-director", "edge-http", "nw-testclient"]
# Bot batches (`nw-testclient swarm` until stopped). The program and its config come from here,
# never from the page. Only the NW_SECRET_* lines of the environment file reach a batch.
testclient_bin = "target/release/nw-testclient"
testclient_config = "local-data/nw-testclient.toml"
testclient_env_file = "local-data/m3-test.env"
# Each batch adds its letters (a, b, ... z, ba, ...); character names hold letters only.
bot_account_prefix = "adminbot"
bot_character_prefix = "Adminbot"
# Character prefixes of bots started outside this panel (config/nw-testclient.toml and the
# local test runs); the live page marks players with these names, and the one above, as bots.
other_bot_prefixes = ["Swarm", "Mobsb"]
max_bots = 10000

[studio]
# The team's design files, the retail files they are merged over (`just bundle`, `just world`),
# and the control FIFO that `just live` (scripts/live-stack.sh) reads. Apply writes the merged
# files into content_dir, then restarts the sims and waits for them.
design_dir = "content"
retail_dir = "local-data/content/retail"
control_fifo = "local-data/logs/live/control"
restart_timeout_s = 120
