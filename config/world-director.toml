# world-director configuration (M5 spec section 6). This file holds no secret.
# Secrets: the world database password, in the variable named by world_database_password_env,
# and the global database password, in the variable named by global_database.password_env.
# Any key below can be overridden with NW_DIRECTOR_<KEY>, nested keys joined by "__".

# The [[world]] id in config/edge.toml.
world_id = "8d0f4c2e-0000-4000-8000-000000000001"
# NATS. Keep it on an internal address.
nats_url = "nats://127.0.0.1:4222"
# Valkey of edge-http: the director writes the free player slots there.
valkey_url = "redis://127.0.0.1:6379"
world_database_password_env = "NW_SECRET_WORLD_1_DATABASE_PASSWORD"
client_build_config = "config/client-build.toml"
# World files from `just world`.
content_dir = "local-data/content"
# The open map level; every sim of this world runs it.
level = "newworld_vitaeeterna"
# Where characters that were never in the world appear, in turn (by entity number): next to a
# fast travel shrine near Edengrove. The height comes from the ground of the world file. Add
# more { x, y } entries to spread new players over the map.
start_positions = [{ x = 11132.5, y = 7305.9 }]
# Edge length of a cell in metres; 2048 is one region of the world file.
cell_size_m = 2048.0
# Longest wait for a sim to take a player; below join_timeout_ms of config/rep-gateway.toml.
admit_timeout_ms = 3000
heartbeat_interval_ms = 1000
# Missed sim heartbeats before its cells go to the other sims.
heartbeat_misses = 3
metrics_listen = "127.0.0.1:9103"
log_filter = "info"

[world_database]
url = "postgres://nw@127.0.0.1:5432/nw_world_1"
max_connections = 5

# The global database with the admin ranks: an account with the game_master rank (or higher)
# gets the client GM flag at login, and its sim takes the client's GM messages. Leave this
# section out to give no account GM rights.
[global_database]
password_env = "NW_SECRET_GLOBAL_DATABASE_PASSWORD"

[global_database.database]
url = "postgres://nw@127.0.0.1:5432/nw_global"
max_connections = 2

# Expeditions, raids and trials (run 15 instances study). Each instance runs on a sim with
# role = "instance" and the level of its game mode (config/sim.toml). These are operator
# settings: how long an empty instance stays (a group can come back), and the waits for the
# instance sim and the social service. Leave the section out for a world without instances.
[instances]
empty_timeout_ms = 300000
open_timeout_ms = 1000
group_timeout_ms = 500

# The arena matchmaking queue (arena flow study 2026-11-11): the players of one match (6 for a
# 3v3; 2 makes the 1v1 matches retail made when few players queued) and how long the players
# have to accept a found match.
[instances.arena]
match_size = 6
accept_timeout_ms = 45000

# The matchmaking queue of Outpost Rush: the players of a match (two teams of half; retail 40,
# two teams of 20) and how long the players have to accept the match once its instance is open.
# A small even size (2 or 4) lets a few test players start a match.
[instances.outpost_rush]
match_size = 40
accept_timeout_ms = 90000

# The matchmaking queue of capture the flag: the players of a match (two teams of half; retail
# 20, two teams of 10) and how long the players have to accept the match once its instance is
# open. A small even size (2 or 4) lets a few test players start a match.
[instances.capture_the_flag]
match_size = 20
accept_timeout_ms = 90000

# The director starts instance sims itself with this command (on this host, no cloud service)
# and stops the ones it started when they stay free. Leave it out to start them by hand.
