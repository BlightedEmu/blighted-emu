# Settings of the status reporter. It sends one world's status (online, player count) and its
# leaderboards to the public website. Run one reporter for each world, on the game machine. Data
# only goes out: the website never connects to this machine and never reads its databases.
#
# This file holds no secret. Three values come from environment variables:
#   the variable that secret_env names                   the world's report secret. It is the
#                                                        same text as the third part of this
#                                                        world's WORLDS entry on the website,
#                                                        32 characters or more
#                                                        (openssl rand -hex 32).
#   the variable that global_database.password_env names the global database password.
#   the variable that world_database_password_env names  the world database password.
# config/servers.env.example lists every variable the servers read.
#
# Any key here can also be set with an environment variable: NW_REPORTER_ and the key in
# capitals. Join the keys of a section with "__", for example
# NW_REPORTER_SITE_URL=http://localhost:3000. Every key is required.

# The id of the world. It must be the id of a [[world]] in config/edge.toml, and the first part
# of this world's WORLDS entry on the website.
world_id = "8d0f4c2e-0000-4000-8000-000000000001"
# The address of the website, with no / at the end.
site_url = "https://example.org"
# The names of the environment variables that hold the report secret and the world database
# password.
secret_env = "NW_SECRET_STATUS_REPORT_SECRET"
world_database_password_env = "NW_SECRET_WORLD_1_DATABASE_PASSWORD"
# Seconds between two status reports, from 3 to 15. The website takes at most 20 reports a
# minute, and it shows "No signal" after 45 s with no report.
status_interval_s = 15
# Seconds between two leaderboard reports, 15 or more. The website takes at most 4 a minute.
leaderboards_interval_s = 300
# The longest wait, in milliseconds, for one metrics page or one answer of the website. Keep it
# shorter than the status interval.
request_timeout_ms = 5000
# How much the reporter logs: "error", "warn", "info", "debug" or "trace", or a filter per
# module.
log_filter = "info"

# The file that names the game client build. The leaderboard table is in the folder of that
# build.
client_build_config = "config/client-build.toml"
# The edge-http settings file of this world. The reporter reads the season end date from its
# remote config sets (javelin.leaderboard-season-end-datetime), so it knows when the season
# boards start again.
edge_config = "config/edge.toml"
# The leaderboard table is <build>/services/leaderboards.json in the content folder (the
# environment variable NW_CONTENT_DIR, local-data/content when it is not set). Make it with
# `content-tool leaderboards`. See "Content data" in README.md.

# The metrics pages (metrics_listen) of each server of the world. A server counts as up when all
# its pages answer. The website shows the world as Offline when the gateway or the sims are
# down, and as Having problems when another server is down. List every sim of the world: the
# reporter does not check a sim that is not in the list.
[parts]
login = ["http://127.0.0.1:9100/metrics"]
gateway = ["http://127.0.0.1:9101/metrics"]
director = ["http://127.0.0.1:9103/metrics"]
sims = ["http://127.0.0.1:9102/metrics"]
social = ["http://127.0.0.1:9111/metrics"]

# When the leaderboards start a new week, month and season. Use the same values as
# [leaderboards] in config/sim.toml.
[leaderboards]
rotation_start_date = "2023-02-07"
weekly_reset_hour = 2
season = 11

# The global database with the leaderboard values that the sims write. password_env names the
# environment variable that holds its password.
[global_database]
password_env = "NW_SECRET_GLOBAL_DATABASE_PASSWORD"

[global_database.database]
url = "postgres://nw@127.0.0.1:5432/nw_global"
max_connections = 2

# The world database with the character and company names.
[world_database]
url = "postgres://nw@127.0.0.1:5432/nw_world_1"
max_connections = 2
