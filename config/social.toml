# social configuration (run 15 social study): the social service of one world (chat, friends,
# blocks, groups, companies, voice setup). This file holds no secret.
# Secrets: the world database password, in the variable named by world_database_password_env,
# and the voice token key, in the variable named by voice.key_env.
# Any key below can be overridden with NW_SOCIAL_<KEY>, nested keys joined by "__".

# The [[world]] id in config/edge.toml.
world_id = "8d0f4c2e-0000-4000-8000-000000000001"
# NATS. Keep it on an internal address.
nats_url = "nats://127.0.0.1:4222"
world_database_password_env = "NW_SECRET_WORLD_1_DATABASE_PASSWORD"
# The game install: the profanity lists come from its paks.
game_dir = "/opt/new-world"
# The sims beat once per second (heartbeat_interval_ms of config/sim.toml).
heartbeat_interval_ms = 1000
# Missed sim heartbeats before its players count as offline (heartbeat_misses of the director).
heartbeat_misses = 3
# Longest wait for a sim to move a player's coins (company treasury).
coin_timeout_ms = 2000
metrics_listen = "127.0.0.1:9111"
log_filter = "info"

# Company rules, named after the client's javelin.social.* keys. The retail remote
# configuration of the captures sets none of them; the client's own defaults are 0.
[companies]
# Seconds after leaving a company before joining one again (guild-rejoining-cooldown-seconds,
# guild-switching-cooldown-seconds; client default 0).
join_cooldown_s = 0
# Least zero-based level that joins a company (guild-join-required-level; client default 0).
join_required_level = 0
# Most coin a treasury holds, hundredths of a coin (best guess: 100,000 coins; no capture or
# client data shows the retail maximum).
treasury_max = 10000000

[world_database]
url = "postgres://nw@127.0.0.1:5432/nw_world_1"
max_connections = 4

# A Vivox-compatible voice service the community runs. Without this section voice calls stay
# unanswered and the client keeps its voice chat off.
