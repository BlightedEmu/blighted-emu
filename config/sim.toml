# Settings of one sim. A sim runs the game world: players, mobs, combat, quests and loot.
# One world has one open-world sim (or several, each with its own cells of the map), and can
# have more sims for expeditions and other instances.
#
# This file holds no passwords. The two database passwords come from environment variables.
# The keys world_database_password_env and global_database_password_env below name them.
# config/servers.env.example lists every variable the servers read.
#
# Any key here can also be set with an environment variable: NW_SIM_ and the key in capitals.
# Join the keys of a section with "__". Examples: NW_SIM_SIM_ID=sim-2,
# NW_SIM_COMBAT__LOOT_DROP_MULTIPLIER=2.0. A NW_SIM_ variable that names no key stops the sim.
#
# The game data comes from the content folder: the environment variable NW_CONTENT_DIR,
# local-data/content when it is not set. See "Content data" in README.md.

# The name of this sim. Every sim of a world needs its own name. The world director uses it to
# give the sim its part of the map.
sim_id = "sim-1"
# The id of the world this sim belongs to. It must be the id of a [[world]] in config/edge.toml.
world_id = "8d0f4c2e-0000-4000-8000-000000000001"
# The NATS message bus that links the servers. Keep it on an address that only your servers
# can reach.
nats_url = "nats://127.0.0.1:4222"
# The names of the environment variables that hold the database passwords.
world_database_password_env = "NW_SECRET_WORLD_1_DATABASE_PASSWORD"
global_database_password_env = "NW_SECRET_GLOBAL_DATABASE_PASSWORD"
# The file that names the game client build this server supports.
client_build_config = "config/client-build.toml"
# The edge-http settings file. The sim reads the gameplay values from it (experience
# multipliers, fast travel cost, disabled items and the other remote config values), so the
# server and the game client use the same values.
edge_config = "config/edge.toml"
# The level this sim runs. Use the same level as config/world-director.toml.
level = "newworld_vitaeeterna"
# The kind of sim:
#   "openmap"   the open world (or the tutorial), in cells the world director gives it.
#   "instance"  one expedition, raid or trial at a time. The level is then the lower-case map
#               name of that game mode, for example "nw_dungeon_windsward_00". The world
#               director can start these sims for you ([instances.launch] in
#               config/world-director.toml).
role = "openmap"
# The longest time, in milliseconds, that a player waits after asking to enter an expedition.
# Keep it longer than the director's waits, and longer than start_wait_ms of
# [instances.launch] in config/world-director.toml.
instance_request_timeout_ms = 65000
# Queued game modes that stay closed on this server. A player who joins one gets the answer
# "not run here". Allowed names: "arena", "outpost_rush", "capture_the_flag", "catacombs".
# Left out, every mode is open.
# closed_queues = ["catacombs"]
# The most players this sim takes. The world director puts the free places into the login
# queue.
max_players = 2000
# How far a player sees other players and mobs, in metres. This is our own value; the retail
# value is Unknown.
interest_radius_m = 100.0
# The most other players one player sees. Players who fight that player come first, then the
# nearest ones. At most 500. A retail war of 45 against 45 showed one client 180 other players.
max_visible_players = 200
# How far below the ground a player's position may be, in metres, before the sim refuses it.
ground_tolerance_m = 2.0
# How far above the ground a player's position may be, in metres. It is above the longest
# fall seen on retail (128.6 m).
max_height_above_ground_m = 150.0
# The movement check. The sim refuses a move that is faster than
# run_speed_mps x (1 + speed_margin) metres a second: 3.25 x 4 = 13 m/s with these values.
# run_speed_mps is the run speed of the game data. The margin lets dodges through: the fastest
# honest retail pace was 10.3 m/s. Smaller values refused real players in a live fight and
# while they swam (2026-09-14). If players say they snap back, watch the metric
# sim_moves_refused_total.
run_speed_mps = 3.25
speed_margin = 3.0
# How many seconds of fast movement the check saves up. 8 s at 13 m/s is 104 m. That is more
# than the largest burst seen on retail (61.8 m in 6 s) and more than a move after a short
# network stall. A real teleport (400 m or more) is still refused.
burst_seconds = 8.0
# A player who goes this many metres into the cells of another sim moves to that sim.
handoff_margin_m = 5.0
# The longest wait, in milliseconds, for the other sim to take the player.
handoff_timeout_ms = 250
# The wait, in milliseconds, before the sim tries a refused or late move to another sim again.
handoff_retry_ms = 1000
# After a player moved to another sim, the inputs that still come here go on to the new sim for
# this many milliseconds.
forward_ttl_ms = 10000
# A copy of a player or mob of a neighbour sim goes away when the neighbour has not renewed it
# for this many milliseconds.
ghost_ttl_ms = 1000
# The threads that build the network updates. 0 uses every CPU core. Give each sim fewer
# threads when several sims share one machine.
tick_threads = 0
# How often, in milliseconds, the sim saves its players to the world database.
save_interval_ms = 10000
# How often, in milliseconds, the sim tells the world director that it is alive.
heartbeat_interval_ms = 1000
# How many heartbeats in a row the sim may miss before the director treats it as gone.
heartbeat_misses = 3
# The address of the Prometheus metrics page. Keep it on an address that only your servers can
# reach.
metrics_listen = "127.0.0.1:9102"
# How much the sim logs: "error", "warn", "info", "debug" or "trace", or a filter per module,
# for example "info,sim::world=debug".
log_filter = "info"

# The world database: characters, items and the saved world. Write the address without the
# password; the password comes from world_database_password_env. max_connections is the size of
# the connection pool.
[world_database]
url = "postgres://nw@127.0.0.1:5432/nw_world_1"
max_connections = 5

# The global database: accounts and leaderboards. Use the same database as [global_database] in
# config/edge.toml.
[global_database]
url = "postgres://nw@127.0.0.1:5432/nw_global"
max_connections = 2

# When the leaderboards start a new week, month and season. These values must be the same as
# the remote config values the game client gets (javelin.leaderboard-rotation-startDate,
# javelin.weekly-leaderboard-reset-hour and javelin.leaderboard-season-rotation). If they are
# different, the sim writes boards that the client never asks for. These are the retail values.
[leaderboards]
rotation_start_date = "2023-02-07"
weekly_reset_hour = 2
season = 11

# The time of the daily and weekly resets (loot limits, recipe cooldowns, instance refreshes and
# gathering locks). The daily reset is at 05:00 local time of the region, with daylight saving
# time. The weekly reset is on Tuesday at the same time. This is how retail did it. Allowed
# regions: "us-east", "us-west", "eu-central", "sa-east", "ap-southeast". Use the region of
# this world in config/edge.toml.
[resets]
region = "us-east"

# Mobs and combat. Every key in this section has a default, so you can leave out any of them.
[combat]
# The game data entries of the player: its vitals, its first weapon and its damage table.
player_vitals_id = "Player"
weapon_id = "SwordT1"
damage_table = "DamageTable"
# The share of the damage that armor can stop, from 0.0 to 1.0.
armor_share = 0.35
# A player this many metres from a sleeping mob wakes it. Left out, it is interest_radius_m.
# wake_radius_m = 100.0
# An awake mob with no target goes back to sleep after this many milliseconds.
sleep_after_ms = 30000
# How far a player's attack reaches when the attack has no swing of its own, in metres. Our own
# value; the retail value is Unknown.
attack_reach_m = 3.0
# Extra reach, in metres, so that a player with a slow connection still hits.
reach_margin_m = 1.0
# The shortest time between two attacks of a player, in milliseconds. The retail sword, the
# fastest tutorial weapon, hits every 400 ms.
min_attack_interval_ms = 400
# How long a killed mob stays away before it comes back, in milliseconds. 62 s was seen on
# retail. The game data says 360 s; why retail used 62 s is Unknown.
mob_respawn_ms = 62000
# The shortest time from a player's death to its respawn request, in milliseconds.
min_respawn_ms = 2000
# A fixed seed for the dice (critical hits, loot, crafting and gathering), to replay a test the
# same way. Left out, each start rolls a new seed.
# seed = 1
# A fixed number in each mob's spawn message. Retail always sent 2. Do not change it.
asset_sub_id = 2
# Multiplies the chance that a killed mob drops loot. 1.0 is the game data (retail). 2.0 gives
# loot from twice as many kills. The chance never goes above a sure drop.
loot_drop_multiplier = 1.0

# How often each mob thinks, in milliseconds. A mob with a target thinks every 33 ms. A moving
# mob with no target thinks every 98 ms within 20 m of a player, every 218 ms within 40 m and
# every 333 ms farther away. A mob that stands with no target thinks every 333 ms. These are the
# rates seen on retail. You can leave out the whole section; if you keep it, give all four keys.
[mob_ai]
combat_interval_ms = 33
moving_interval_ms = [98, 218, 333]
moving_range_m = [20.0, 40.0]
idle_interval_ms = 333

# Settings for the admin site.
[admin]
# How often, in milliseconds, the sim sends a list of its players and awake mobs to the admin
# site's live page. 0 turns it off. When it is on, use 100 or more.
snapshot_interval_ms = 0
# The most mobs that one GM command, script or event may spawn, at least 1. This is our own
# limit. Each mob costs work on every tick, so a typo in a count must not fill an area.
max_gm_spawn = 50

# The trading post. Every key in this section has a default.
[trading_post]
# The order lengths a player can pick, in days. These are the retail lengths.
durations_days = [1, 3, 7, 14]
# The most open orders one player can have. 40 is the game client's own default.
max_open_orders = 40
# The tax on a sale, from 0.0 to below 1.0. 0.05 is 5 %, as seen on retail.
trading_tax = 0.05
# A settlement with its own tax. Each entry is { outpost = <settlement id>, trading_tax = <rate> }.
# Example: outposts = [{ outpost = 1, trading_tax = 0.08 }]
outposts = []
# The fee to post an order. The retail fee table is Unknown, so this file sets no fee. Each entry
# is { kind = "buy" or "sell", days = <order length>, flat = <hundredths of a coin>,
# share = <part of the order value, 0.0 to below 1.0> }.
# Example: posting_fees = [{ kind = "sell", days = 1, flat = 0, share = 0.01 }]
posting_fees = []
# How often, in milliseconds, the sim gives its players the items and coin of their finished
# orders.
delivery_poll_ms = 2000

# Test worlds only: tools that each new character wears when it first enters the world. Leave
# this out in a world that players use. slot is the tool slot: 33 logging, 34 harvesting,
# 35 skinning, 36 mining, 37 fishing. item is an item id of the game data.
# [[start_tools]]
# item = "LoggingAxeT1"
# slot = 33
