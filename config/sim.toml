# sim configuration (M4 spec section 7, M5 spec section 7.1). This file holds no secret.
# Secret: the world database password, in the variable named by world_database_password_env.
# Any key below can be overridden with NW_SIM_<KEY>, nested keys joined by "__".

# This sim's id; unique in the world. world-director gives it cells.
sim_id = "sim-1"
# The [[world]] id in config/edge.toml.
world_id = "8d0f4c2e-0000-4000-8000-000000000001"
# NATS. Keep it on an internal address.
nats_url = "nats://127.0.0.1:4222"
world_database_password_env = "NW_SECRET_WORLD_1_DATABASE_PASSWORD"
client_build_config = "config/client-build.toml"
# World files from `just world`.
content_dir = "local-data/content"
# The open map level; the same as in config/world-director.toml.
level = "newworld_vitaeeterna"
# Most players in this sim; the director adds the free ones to the login queue.
max_players = 2000
# Our own choice; the retail range is Unknown.
interest_radius_m = 100.0
# The nearest others in a player's bundles: with the player itself they fill one bundle. The
# retail limit is Unknown.
max_visible_players = 47
ground_tolerance_m = 2.0
# Above the largest captured fall (128.6 m, movement numbers note, Check section).
max_height_above_ground_m = 150.0
# Movement (M4 spec section 7.2 with sections 15 and 16). run_speed_mps is the datasheet
# ServerValidatedCanRun speed. The limit is 3.25 x (1 + 1.2) = 7.15 m/s: above sprint (5.5 m/s)
# with the 15 % road boost (6.3 m/s). Faster captured speeds have an Unknown cause (mounts,
# speed effects); sim has none of them yet. Watch sim_moves_refused_total in live tests.
run_speed_mps = 3.25
speed_margin = 1.2
# Longer than the longest gap between captured movement messages (1.5 to 2.5 s), so a player
# who moved on during a stall is not refused when its next message comes.
burst_seconds = 3.0
# Handoff (M5 spec section 3.3): a player this far into another sim's cells moves to that sim.
handoff_margin_m = 5.0
handoff_timeout_ms = 250
handoff_retry_ms = 1000
# Inputs that reach this sim after a handoff go on to the new sim for this long.
forward_ttl_ms = 10000
# Ghosts of another sim that are not renewed for this long are dropped.
ghost_ttl_ms = 1000
# Threads of the bundle step; 0 = every core. Several sims on one PC can share the cores.
tick_threads = 0
save_interval_ms = 10000
heartbeat_interval_ms = 1000
heartbeat_misses = 3
metrics_listen = "127.0.0.1:9102"
log_filter = "info"

[world_database]
url = "postgres://nw@127.0.0.1:5432/nw_world_1"
max_connections = 5

# Mobs and combat (M6-A spec section 9). Values marked Unknown are not in the game files yet;
# the study notes of M6-B replace them with numbers from the captures.
[combat]
player_vitals_id = "Player"
weapon_id = "SwordT1"
attack_damage_ids = ["1H_Sword_Attack1", "1H_Sword_Attack2"]
armor_share = 0.35
player_armor_share = 0.0
mob_attack_factor = 1.0
# wake_radius_m: absent means interest_radius_m.
sleep_after_ms = 30000
# Unknown.
base_sight_m = 20.0
# Unknown.
wander_radius_m = 10.0
# Unknown.
wander_pause_ms = 5000
# Unknown.
leash_radius_m = 50.0
# Unknown.
attack_reach_m = 3.0
reach_margin_m = 1.0
# Unknown.
min_attack_interval_ms = 500
# Unknown.
mob_attack_interval_ms = 2000
mob_speed_mps = 3.25
mob_respawn_ms = 360000
# Unknown.
player_respawn_ms = 10000
seed = 1
# The u32 of a mob spawn card AssetId (Azoth catalog field note: always 2).
asset_sub_id = 2
