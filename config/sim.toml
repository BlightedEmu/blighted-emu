# sim configuration (M4 spec section 7, M5 spec section 7.1). This file holds no secret.
# Secrets: the world and global database passwords, in the variables named by
# world_database_password_env and global_database_password_env.
# Any key below can be overridden with NW_SIM_<KEY>, nested keys joined by "__".

# This sim's id; unique in the world. world-director gives it cells.
sim_id = "sim-1"
# The [[world]] id in config/edge.toml.
world_id = "8d0f4c2e-0000-4000-8000-000000000001"
# NATS. Keep it on an internal address.
nats_url = "nats://127.0.0.1:4222"
world_database_password_env = "NW_SECRET_WORLD_1_DATABASE_PASSWORD"
global_database_password_env = "NW_SECRET_GLOBAL_DATABASE_PASSWORD"
client_build_config = "config/client-build.toml"
# The edge-http config. The sim reads the gameplay values (XP multipliers, disabled item
# classes, datasheet overrides, ...) from the same remote config sets edge-http gives the client
# ([remote_config] there), so the server and the client use one source.
edge_config = "config/edge.toml"
# World files from `just world`.
content_dir = "local-data/content"
# The open map level; the same as in config/world-director.toml.
level = "newworld_vitaeeterna"
# What this sim runs: "openmap" (cells of the open map, or the tutorial) or "instance" (one
# expedition, raid or trial at a time; level is then the lower-case map name of its game mode,
# for example "nw_dungeon_windsward_00"). The world director can start instance sims itself
# ([instances.launch] in config/world-director.toml).
role = "openmap"
# Longest wait for the director's answer to an expedition request; above the director's group
# and opening waits.
instance_request_timeout_ms = 3000
# Most players in this sim; the director adds the free ones to the login queue.
max_players = 2000
# Our own choice; the retail range is Unknown.
interest_radius_m = 100.0
# Most others a player sees: those fighting it first, then the nearest. Bundles split by bytes
# and a per-tick budget picks who goes each tick, so this is no bundle limit. Retail's 45-vs-45
# war showed one client 180 other players; at most 500.
max_visible_players = 200
ground_tolerance_m = 2.0
# Above the largest captured fall (128.6 m, movement numbers note, Check section).
max_height_above_ground_m = 150.0
# Movement (M4 spec section 7.2 with sections 15 and 16). run_speed_mps is the datasheet
# ServerValidatedCanRun speed. The limit is 3.25 x (1 + 3.0) = 13 m/s: faster than the fastest
# honest pace of the retail tutorial capture (10.3 m/s while dodging: 17.1 m in 1 s, 37.2 m in
# 3 s, 61.8 m in 6 s, and 6.3 m/s over 40 s), so the distance budget fills again while the
# player dodges. With 7.15 m/s, and again with 10.4 m/s and a 3 s burst (31.2 m < 37.2 m), a
# live fight and the swim to shore emptied the budget and every later move was refused
# (2026-09-14). Watch sim_moves_refused_total in live tests.
run_speed_mps = 3.25
speed_margin = 3.0
# 8 s at the limit hold 104 m: above the largest burst of the retail capture (61.8 m in 6 s)
# and above a move that covers the longest gap between captured movement messages (1.5 to
# 2.5 s), so a player who moved on during a stall is not refused when its next message comes.
# What stays refused is a real teleport (400 m or more in the captures).
burst_seconds = 8.0
# Handoff (M5 spec section 3.3): a player this far into another sim's cells moves to that sim.
handoff_margin_m = 5.0
handoff_timeout_ms = 250
handoff_retry_ms = 1000
# Inputs that reach this sim after a handoff go on to the new sim for this long.
forward_ttl_ms = 10000
# Ghosts of another sim that are not renewed for this long are dropped.
ghost_ttl_ms = 1000
# Threads of the bundle step; 0 = every core. Several sims on one PC can share the cores.
tick_threads = 0
save_interval_ms = 10000
heartbeat_interval_ms = 1000
heartbeat_misses = 3
metrics_listen = "127.0.0.1:9102"
log_filter = "info"

[world_database]
url = "postgres://nw@127.0.0.1:5432/nw_world_1"
max_connections = 5

# The leaderboard stats (docs/re/2026-09-18-leaderboards-and-analytics.md); the same database as
# [global_database] in config/edge.toml.
[global_database]
url = "postgres://nw@127.0.0.1:5432/nw_global"
max_connections = 2

# The leaderboard rotations. They must equal the keys the config layers give the client
# (javelin.leaderboard-rotation-startDate, javelin.weekly-leaderboard-reset-hour,
# javelin.leaderboard-season-rotation), or the sim writes boards the client never asks for.
# Retail values: start date and season from the 2026-06-30 capture (w178, m41, s11), reset hour
# from the iad-prod RegionId layer of 2026-09-18.
[leaderboards]
rotation_start_date = "2023-02-07"
weekly_reset_hour = 2
season = 11

# The resets of the loot limits (LootLimitData): a daily limit (LimitExpireSeconds 64800 or
# 86400) resets each day at hour_utc, a weekly one (604800) on weekly_day at that hour. Retail
# (loot tracker entries of 707 capture ledgers): weekly ones always end on a Tuesday; the hour
# is 09:00 UTC on the US East server of our config sets (newchar ledger 2026-09-18, 31 ledgers)
# and 03:00 UTC on 417 ledgers of another server. Whether the hour follows daylight saving time
# is Unknown.
[loot_limits]
hour_utc = 9
weekly_day = "tuesday"

# Mobs and combat (M6-A spec section 9). Values marked Unknown are not in the game files yet;
# the study notes of M6-B replace them with numbers from the captures.
[combat]
player_vitals_id = "Player"
weapon_id = "SwordT1"
# The player's damage table (the player slice names javelindata_damagetable, unique id DamageTable).
damage_table = "DamageTable"
armor_share = 0.35
# Retail 3601 hits on a new character in starter armor keep 0.6006 of the damage.
player_armor_share = 0.3994
# wake_radius_m: absent means interest_radius_m.
sleep_after_ms = 30000
# The reach of a player's attack request without a swing: Unknown.
attack_reach_m = 3.0
reach_margin_m = 1.0
# The retail sword's hit spacing, the fastest tutorial weapon (sword 400, axe 700, hammer 830 ms).
min_attack_interval_ms = 400
mob_respawn_ms = 360000
# Shortest time from a death to a respawn request (the client asks, type 1938): below the
# lowest captured gap.
min_respawn_ms = 2000
seed = 1
# The u32 of a mob spawn card AssetId (Azoth catalog field note: always 2).
asset_sub_id = 2
# Times each mob type's LootDropChance (the share of kills whose loot table rolls), at most a
# sure drop. 1.0 is the game data's chance (retail); 2.0 doubles the kills that drop loot.
loot_drop_multiplier = 1.0

# How often a mob's behavior tree runs (retail ALC state rates of the newchar capture
# 2026-09-18, trace finding c; the rate of the states is Inferred equal to the AI tick rate):
# with a target 33 ms at every distance; moving without one 98 ms within 20 m, 218 ms to
# 40 m and 333 ms beyond; standing without one 333 ms.
[mob_ai]
combat_interval_ms = 33
moving_interval_ms = [98, 218, 333]
moving_range_m = [20.0, 40.0]
idle_interval_ms = 333

# The admin tool's live panel (admin tools spec, section 5). The
# snapshot of players and awake mobs on the bus is off at 0; at least 100 ms when on.
[admin]
snapshot_interval_ms = 0

# The trading post (economy note, run 15). Durations 1, 3, 7 and 14 days are every captured
# order's; a 5 % trading tax was Observed at the settlements of three retail characters; at most
# 40 open orders is the client's ContractConfigData default. The retail posting fee table is in
# no client pak (Unknown), so no fee is listed. A settlement with its own tax is an entry of
# `outposts` ({ outpost = <id>, trading_tax = <rate> }); a fee is an entry of `posting_fees`
# ({ kind = "buy" | "sell", days = <days>, flat = <hundredths>, share = <rate> }). The sim
# takes the trading post deliveries of its players every `delivery_poll_ms`.
[trading_post]
durations_days = [1, 3, 7, 14]
max_open_orders = 40
trading_tax = 0.05
outposts = []
posting_fees = []
delivery_poll_ms = 2000
