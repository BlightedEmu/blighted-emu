# nw-testclient configuration (M3 spec section 8, M4 spec section 9). This file holds no secret.
# Secrets: NW_SECRET_TESTCLIENT_PASSWORD, the password of the test account, and
# NW_SECRET_TESTCLIENT_PASSWORD_B, the password of the second account (pair only).
# Any key below can be overridden with NW_TESTCLIENT_<KEY>.

# The launcher API and the game routes of edge-http.
login_url = "https://login.example.org"
game_url = "https://game.example.org"
# Test account; it is registered on the first run.
account = "testclient"
# Character made when the account has none (3 to 16 letters).
character_name = "Testclient"
# Second account and character of `nw-testclient pair`.
second_account = "testclient_b"
second_character_name = "Testclientb"
# The gateway's certificate (the file rep-gateway generate-certificate wrote).
certificate_file = "local-data/rep-gateway/cert.pem"
# DTLS MTU in bytes.
mtu = 1200
# Seconds to stay connected after registration (M3 exit test: 60).
hold_seconds = 60
# Seconds to wait for the registration response.
registration_timeout_seconds = 30
# pair: largest distance between the saved position and the next login, in metres.
position_tolerance_m = 0.1
# pair: the first client walks these points (east, north of where it stands, in metres) at the
# walking speed of the datasheets, then sends one move this far east, which sim must refuse.
route_m = [[0.0, 0.0], [4.0, 0.0], [4.0, 4.0], [0.0, 4.0]]
route_speed_mps = 1.65
jump_m = 50.0
# pair: largest distance of a seen position from the route, in metres.
path_tolerance_m = 1.0
