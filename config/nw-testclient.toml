# nw-testclient configuration (M3 spec section 8, M4 spec section 9). This file holds no secret.
# Secrets: NW_SECRET_TESTCLIENT_PASSWORD, the password of the test account,
# NW_SECRET_TESTCLIENT_PASSWORD_B, the password of the second account (pair only), and
# NW_SECRET_TESTCLIENT_SWARM_PASSWORD, the password of every bot account (swarm only).
# Any key below can be overridden with NW_TESTCLIENT_<KEY>.

# The launcher API and the game routes of edge-http.
login_url = "https://login.example.org"
game_url = "https://game.example.org"
# Test account; it is registered on the first run.
account = "testclient"
# Character made when the account has none (3 to 16 letters).
character_name = "Testclient"
# Second account and character of `nw-testclient pair`.
second_account = "testclient_b"
second_character_name = "Testclientb"
# The gateway's certificate (the file rep-gateway generate-certificate wrote).
certificate_file = "local-data/rep-gateway/cert.pem"
# DTLS MTU in bytes.
mtu = 1200
# Seconds to stay connected after registration (M3 exit test: 60).
hold_seconds = 60
# Seconds to wait for the registration response.
registration_timeout_seconds = 30
# pair: largest distance between the saved position and the next login, in metres.
position_tolerance_m = 0.1
# pair: the first client walks these points (east, north of where it stands, in metres) at the
# walking speed of the datasheets, then sends one move this far east, which sim must refuse.
route_m = [[0.0, 0.0], [4.0, 0.0], [4.0, 4.0], [0.0, 4.0]]
route_speed_mps = 1.65
jump_m = 50.0
# pair and swarm: largest distance of a seen position from the route, in metres.
path_tolerance_m = 1.0

# swarm (M5 exit test): bots walk to their lane, then east and west across the start line. Put
# world-director's start_position on a sim border (the director logs the x range of each sim).
[swarm]
bots = 1000
# world-director's start_positions (config/world-director.toml); each bot crosses the x of the
# start nearest to where it appears.
starts_m = [[11132.5, 7305.9]]
# Receive and send buffer of each bot socket. Linux caps it at net.core.rmem_max / wmem_max.
udp_buffer_bytes = 4194304
# Accounts bot00000, bot00001, ...; characters Swarmaaa, Swarmaab, ... They are registered on the
# first run; raise edge-http's auth.login_fail_limit for that run (one registration per bot).
account_prefix = "bot"
character_prefix = "Swarm"
bots_per_second = 50
lane_spread_m = 150.0
swing_m = 20.0
# Below the sim limit of 7.15 m/s, also on a slope.
speed_mps = 4.0
duration_seconds = 120
min_crossings = 4
max_bundle_gap_ms = 250
# Each bot changes its block every 2 s; every bot times how fast it sees the others' changes.
block_toggle_ms = 2000
# Two 33 ms ticks and the loopback network (replication note).
max_sync_latency_ms = 100
# The metrics listener of every sim.
metrics_urls = ["http://127.0.0.1:9102/metrics"]
client_build_config = "config/client-build.toml"
content_dir = "local-data/content"
level = "newworld_vitaeeterna"

# hunt (M6-B exit test): bots walk to the nearest mob they see, stop in reach and attack it; a
# bot that dies asks to respawn. The accounts, sockets, walking speed and ground are those of
# [swarm]. Put the hunt starts on flat land near low-level spawns (the M6-B record lists them).
[hunt]
# At most 30 bots per start: each player sees its 47 nearest entities, bots and mobs together.
bots = 30
bots_per_second = 10
# Bot n waits on a ring of 8 m around start n modulo their number while it sees no mob.
starts_m = [[11132.5, 7305.9]]
# Below the sim's attack reach (combat.attack_reach_m = 3.0).
reach_m = 2.5
attack_interval_ms = 600
# The captured gap from a 4299 to the client's 1938 is 2.42 to 2.65 s.
respawn_wait_ms = 2500
duration_seconds = 120
max_bundle_gap_ms = 250
metrics_urls = ["http://127.0.0.1:9102/metrics"]
