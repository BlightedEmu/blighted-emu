# edge-http configuration (M2 spec section 9). This file holds no secret.
# Secrets come from environment variables:
#   NW_SECRET_SIGNING_KEY               entry ticket key, hex, 32+ bytes (openssl rand -hex 32)
#   NW_SECRET_GLOBAL_DATABASE_PASSWORD  password of [global_database]
#   NW_SECRET_DISCORD_CLIENT_SECRET     Discord client secret (mode = "discord" only)
#   the variable named by each [[world]] database_password_env
# Any key below can be overridden with NW_EDGE_<KEY>, nested keys joined by "__",
# for example NW_EDGE_AUTH__MODE=discord.

server_name = "Blighted test server"
# Your own domain. The launcher API and the channel config are on https://login.<domain>, the
# game routes on https://game.<domain>. The certificate must cover both names.
domain = "example.org"
https_listen = "0.0.0.0:443"
# Plain HTTP listener of the client's region ping (GET /ping on dynamodb.<region>.amazonaws.com,
# which the launcher maps to this server). The client pings port 80.
ping_listen = "0.0.0.0:80"
# The ports players reach the two listeners on. Set them when a router or proxy forwards other
# ports to the listeners, or when the listeners use other ports. Links to login.<domain> and
# game.<domain> name public_https_port when it is not 443, and players type it after the domain
# in the launcher (example.org:8443). The launcher's proxy sends the region ping to
# public_ping_port. With other ports than 443 and 80, players need a client patched with
# --aws-proxy (docs/client-patch.md), also on Linux.
public_https_port = 443
public_ping_port = 80
# Prometheus metrics. Keep this on an internal address.
metrics_listen = "127.0.0.1:9100"
request_timeout_seconds = 10
# Most requests in progress at one time.
max_connections = 4096
log_filter = "info"

[tls]
# PEM files from an ACME tool (certbot, lego). Keep them in local-data/, never in git.
certificate_pem_path = "local-data/edge-http/fullchain.pem"
private_key_pem_path = "local-data/edge-http/privkey.pem"

[auth]
# Login type, one per server:
#   "password"  players make an account with a username and password in the launcher.
#   "discord"   players log in with Discord (needs [discord] below and the
#               NW_SECRET_DISCORD_CLIENT_SECRET secret).
mode = "password"
# Password mode only: true lets players make new accounts in the launcher; false: only
# accounts that exist can log in. (In Discord mode, use [discord] allow_list instead.)
allow_registration = true
# Parallel Argon2id hashes; 0 = number of CPUs.
argon2_parallel = 0
login_fail_limit = 10
login_fail_window_seconds = 600
game_session_ttl_seconds = 7200

[discord]
# Used only when [auth] mode = "discord". Every new account is a normal player; staff ranks
# are given on the admin site.
#
# Discord application id (Discord Developer Portal, your app, OAuth2, Client ID).
client_id = ""
# Discord server check. A Discord server id (Discord: Developer Mode on, right-click the
# server, Copy Server ID): only members of that server can log in.
# Off: "" (empty).
guild_id = ""
# Allow list. true: only the Discord user ids in allowed_user_ids and the holders of a role in
# allowed_role_ids can log in and make accounts; a user taken off the list can no longer press
# Play, even with an old login. false (the default): every Discord user can (still limited by
# guild_id). Both checks can be on together. Restart edge-http after a change.
allow_list = false
# Discord user ids (Discord: Developer Mode on, right-click a name, Copy User ID), for
# example ["80351110224678912", "175928847299117063"].
allowed_user_ids = []
# Discord role ids in the guild_id server (Server Settings, Roles, right-click a role, Copy Role
# ID). Needs guild_id. The roles are read at each Discord login; a Play uses those of the last
# login, so a role given or taken in Discord counts from the player's next login.
allowed_role_ids = []

[global_database]
url = "postgres://nw@127.0.0.1:5432/nw_global"
max_connections = 5

[valkey]
url = "redis://127.0.0.1:6379"

# Our own remote config sets (docs/re/2026-09-18-remote-config-layers.md). The client reads them
# from an S3 bucket; this server answers that bucket's host. `directory` holds one JSON file per
# layer: <application>-<dimension>.json (ProductId, RegionId, CognitoId) and
# <application>-WorldId-<world id>.json for each world, for the applications `public` and
# `publicGameplay`; no other file. The server fills omni.leaderboards.client-endpoint of
# publicGameplay-RegionId.json with game.<domain>.
[remote_config]
directory = "config/remote-config"
# The bucket the client asks for (its log line "Configuring remote config with bucket ...").
bucket = "ags-javelin-remote-config"
# Our own id, sent to the client as -CognitoPool. It names no Amazon pool.
cognito_pool_id = "b04fbfcd-942c-472d-88c0-c762c4076b2f"

# Our own news: the message of the day, the news stories and the menu tiles the client reads
# from its news host, and their images. One subfolder per host, named after it; every file in it
# is served at its path. The news host folder must hold motd/worlds_STEAM_APP_ID.1063730.json,
# newsstories/STEAM_APP_ID.1063730/metadata.json and marketingtiles/STEAM_APP_ID.1063730/
# metadata.json; each image URL in them needs its file in the image host folder.
[cms]
directory = "config/cms"

# The community's public website (docs/website-integration.md) is a [website] section with one
# key, site_url (such as https://example.org, no trailing /). This file has none: a server
# without a site shows no launcher news and serves the message of the day from [cms]. Put the
# section in the git-ignored local config. With it, the launcher reads its news from
# <site_url>/api/news?target=launcher (GET /launcher/news-source names it), and edge-http gets
# the message of the day from <site_url>/api/game/cms/motd once a minute; the [cms] file is only
# the first copy.

# The Amazon names our launcher maps to this server, for the game process only (private hosts
# file and trust file under bwrap, or the loopback proxy on Windows). Only the remote-config
# bucket host, Kinesis, STS and DynamoDB (region ping) hosts and the two news hosts are allowed,
# and the bucket host, the region ping host of us-east-1 and both news hosts are required. Make
# the certificate with `edge-http aws-mirror-certificate` (again after a change of this list);
# keep both files in local-data/, never in git.
[aws_mirror]
hosts = [
    "ags-javelin-remote-config.s3.amazonaws.com",
    "kinesis.us-east-1.amazonaws.com",
    "sts.us-east-1.amazonaws.com",
    "dynamodb.us-east-1.amazonaws.com",
    "d1hkbwzm1bktgo.cloudfront.net",
    "client.content-service.amazongames.com",
]
certificate_pem_path = "local-data/edge-http/aws-mirror.pem"
private_key_pem_path = "local-data/edge-http/aws-mirror-key.pem"

# The in-game store. edge-http serves its catalog, each account's unlocks and each account's
# Marks of Fortune (the store currency) on game.<domain>; a purchase goes through the game
# connection to the sim, which pays it from the account's wallet and saves the unlock. Restart
# edge-http and the sims after a change. Give an account Marks of Fortune with
# `blighted-admin give-marks <login name> <amount>` (a negative amount takes them).
[shop]
# The store table that `content-tool store` writes from the content bundle: the mounts the store
# sells (52 in build 25810808). Without the file the store sells nothing.
store_table = "local-data/content/store-25810808.json"
# Whether the store sells. false: the catalog is empty and purchases are refused; the mounts an
# account already got stay its own.
enabled = true
# Whether every mount costs 0 Marks of Fortune, as in retail's last weeks. false: a mount costs
# its price below, paid from the account's wallet; a wallet below the price buys nothing.
free = true
# The price of a mount in Marks of Fortune when the store is not free (retail: 20000 for most
# mounts, 15000 or 10000 for some).
mount_price = 20000

# The price of single mounts, by the store entitlement that unlocks them (the `entitlement` of the
# store table); every other mount costs mount_price. For example:
# Ent_Mount_MTX_1_wolf = 15000
[shop.mount_prices]

# The analytics stream the client puts its events on (research data; nothing reads it).
# Best guesses from 6,533 retail PutRecords of 255 sessions: the largest body was 61,922 bytes,
# one client sent at most 44 requests and 1,096,336 bytes in a minute.
[analytics]
# Largest body of one request, in bytes.
max_body_bytes = 262144
# Requests of one client address a minute.
requests_per_minute = 120
# Body bytes of one client address a minute.
bytes_per_minute = 4194304
# Days a record is kept; older ones are deleted once an hour.
retention_days = 30

# Experience multipliers. Each value multiplies one kind of experience: 1.0 is normal (the
# amount the game data gives), 2.0 is double, 0.5 is half, 0.0 gives none. Any number of 0 or
# more works. The server sends these values to the game (remote config javelin.xp-multipliers,
# publicGameplay-ProductId layer) and the sims use the same values, so what a player sees and
# what the server gives match. A setting left out is 1.0. Restart edge-http and the sims after
# a change. Retail without an event is 1.0 everywhere; retail's last event (servers closing) was
# character 2.0, trade skills 2.0, weapon masteries 2.0 and territory standing 3.0.
[experience]
# Character experience: everything that raises the character level (mob kills, quests, town
# projects, expeditions, gathering and crafting character experience).
character = 1.0
# Umbral Crystals (the UmbralCurrency progression of the game data).
umbral_crystals = 1.0

# Trade skill experience, one value per trade skill.
[experience.trade_skills]
# Crafting skills.
# Weaponsmithing: crafting melee weapons (swords, axes, hammers, ...).
weaponsmithing = 1.0
# Armoring: crafting heavy, medium and light armor.
armoring = 1.0
# Engineering: crafting ranged weapons, tools and ammunition.
engineering = 1.0
# Jewelcrafting: crafting amulets, rings and earrings.
jewelcrafting = 1.0
# Arcana: crafting potions, coatings and magic weapons.
arcana = 1.0
# Cooking: cooking food.
cooking = 1.0
# Furnishing: crafting house furniture and decorations.
furnishing = 1.0
# Refining skills.
# Smelting: ore into ingots.
smelting = 1.0
# Woodworking: wood into timber.
woodworking = 1.0
# Leatherworking: rawhide into leather.
leatherworking = 1.0
# Weaving: fibers into cloth.
weaving = 1.0
# Stonecutting: stone into blocks, and cutting gems.
stonecutting = 1.0
# Gathering skills.
# Mining: ore and stone nodes.
mining = 1.0
# Logging: trees.
logging = 1.0
# Harvesting: plants, fibers and herbs.
harvesting = 1.0
# Tracking and Skinning: animal carcasses (the game data calls it Skinning).
skinning = 1.0
# Fishing: catching fish.
fishing = 1.0
# Other skills.
# Musician: playing instruments.
musician = 1.0
# Riding: for example mount food, mount races and mount quests.
riding = 1.0

# Weapon mastery experience, one value per weapon.
[experience.weapon_masteries]
# One-handed weapons.
sword_and_shield = 1.0
rapier = 1.0
hatchet = 1.0
flail = 1.0
dagger = 1.0
# Two-handed weapons.
spear = 1.0
great_axe = 1.0
war_hammer = 1.0
greatsword = 1.0
# Ranged weapons.
bow = 1.0
musket = 1.0
blunderbuss = 1.0
# Magic weapons.
fire_staff = 1.0
life_staff = 1.0
ice_gauntlet = 1.0
void_gauntlet = 1.0

# Territory standing experience, one value per territory: standing points from quests, town
# projects, crafting, gathering and kills in that territory.
[experience.territory_standing]
brightwood = 1.0
everfall = 1.0
reekwater = 1.0
windsward = 1.0
ebonscale_reach = 1.0
elysian_wilds = 1.0
cutlass_keys = 1.0
mourningdale = 1.0
monarchs_bluffs = 1.0
weavers_fen = 1.0
edengrove = 1.0
restless_shore = 1.0
brimstone_sands = 1.0
nighthaven = 1.0

# Fast travel. free = true: a fast travel to a settlement or a shrine costs no azoth.
# free = false: the retail cost (20 azoth, 10 within your own territory). An inn recall and a
# home travel never cost azoth. The server sends this value to the game (remote config
# javelin.playtest-disable-fast-travel-costs, publicGameplay-ProductId layer) and the sims use the
# same value, so the cost the map shows and the azoth the server takes match. Left out is
# false. Restart edge-http and the sims after a change.
[fast_travel]
free = false

# The community's voice service. The social service's [voice] api_url
# (https://game.<domain>/vivox/api2/) leads the game's voice SDK here first: this server answers
# its prelogin with the hosts below. Left out, the prelogin is not served and voice stays off.
# When players reach this server on another HTTPS port than 443, the voice SDK sends the prelogin
# without TLS: the ping listener answers it too, and api_url names the public ping port
# (https://game.<domain>:<public_ping_port>/vivox/api2/).
# [voice]
# realm = "voice.example.org"            # the social service's [voice] domain
# xmpp_host = "game.example.org"         # the voice server that signs players in
# xmpp_port = 5223
# xmpp_tls = true
# ws_xmpp_url = "wss://game.example.org:443/ws-xmpp"
# telemetry_url = "https://game.example.org"

[[world]]
id = "8d0f4c2e-0000-4000-8000-000000000001"
name = "Aeternum"
region = "us-east"
# Token.RepAddress: IPv4:port of the rep-gateway that serves this world. One rep-gateway serves
# one world, so each [[world]] needs its own address.
rep_address = "127.0.0.1:33435"
database_password_env = "NW_SECRET_WORLD_1_DATABASE_PASSWORD"
# Live entry tickets at one time. Players are admitted only while world-director also reports
# free player slots (M5).
capacity = 100
# Characters one account may have in this world.
max_characters_per_account = 2
refresh_interval_seconds = 5
queue_requests_per_minute = 30

[world.database]
url = "postgres://nw@127.0.0.1:5432/nw_world_1"
max_connections = 5
